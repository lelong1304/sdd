spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "voxxed_luxembourg.sdd.fraudcheck.infrastructure"
        spring.json.value.default.type: "voxxed_luxembourg.sdd.fraudcheck.infrastructure.OrderPlacedDto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    orders-topic: orders
    fraud-checks-topic: fraud-checks
    consumer-group: fraud-check-service

kind: Application